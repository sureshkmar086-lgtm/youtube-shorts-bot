name: Four US Shorts Channels

on:
  pull_request:
    paths:
      - agent_bot.py
      - content_bank.py
      - auto_pipeline.py
      - tools/approve_bank.py
      - content_bank/**
      - tests/**
      - requirements.txt
      - .github/workflows/daily_run.yml
  schedule:
    - cron: "0 19 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      channel:
        description: "कौन-सा चैनल चलाना है?"
        type: choice
        options:
          - history
          - psychology
          - finance
          - ai
          - all
        default: all

      mode:
        description: "auto: नया वीडियो; release_existing: पहले अपलोड वीडियो public; render: preview"
        type: choice
        options:
          - release_existing
          - auto
          - preflight
          - status
          - verify
          - render
          - publish
          - upload
        default: auto

      source_run_id:
        description: "publish के लिए preview run का ID"
        type: string
        required: false

      source_attempt:
        description: "publish के लिए preview attempt"
        type: string
        default: "1"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Python libraries
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt
          python -m pip check

      - name: Set up standalone FFmpeg and FFprobe
        id: ffmpeg_setup
        continue-on-error: true
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Retry transient FFmpeg download
        if: steps.ffmpeg_setup.outcome == 'failure'
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Verify video tools and subtitle font
        timeout-minutes: 1
        run: |
          ffmpeg -version
          ffprobe -version
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Offline regression checks without API keys
        if: inputs.mode != 'verify'
        run: |
          python -u agent_bot.py --self-test
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Render all four synthetic fixtures without API keys
        if: inputs.mode == 'verify'
        run: python -u agent_bot.py --self-test-render

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/**/*.json
          retention-days: 3
          if-no-files-found: ignore

  plan:
    needs: verify
    if: github.event_name != 'pull_request' && inputs.mode != 'verify'
    runs-on: ubuntu-24.04

    outputs:
      channels: ${{ steps.select.outputs.channels }}
      enabled: ${{ steps.select.outputs.enabled }}

    steps:
      - name: Select channels
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'true' }}
          SELECTED_CHANNEL: ${{ inputs.channel || 'all' }}
          SELECTED_MODE: ${{ inputs.mode || 'auto' }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt || '1' }}
        run: |
          python - <<'PY'
          import json
          import os

          allowed = ["history", "psychology", "finance", "ai"]
          selected = os.environ["SELECTED_CHANNEL"]
          mode = os.environ["SELECTED_MODE"]

          if selected not in allowed + ["all"]:
              raise SystemExit("Invalid channel")

          if mode not in ["preflight", "status", "render", "publish", "upload", "auto", "release_existing"]:
              raise SystemExit("Invalid mode")

          enabled = (
              os.environ["EVENT_NAME"] != "schedule"
              or os.environ["AUTOMATION_ENABLED"].strip().lower() == "true"
          )

          if mode == "publish":
              if (
                  not os.environ["SOURCE_RUN"].isdigit()
                  or not os.environ["SOURCE_ATTEMPT"].isdigit()
                  or int(os.environ["SOURCE_ATTEMPT"]) < 1
              ):
                  raise SystemExit(
                      "publish requires a preview source_run_id and positive source_attempt"
                  )

          chosen = allowed if selected == "all" else [selected]
          channels = [{"id": x, "suffix": x.upper()} for x in chosen]

          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("channels=" + json.dumps(channels) + "\n")
              stream.write("enabled=" + str(enabled).lower() + "\n")
          PY

  channel:
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}

    concurrency:
      group: shorts-${{ github.repository }}-${{ matrix.channel.id }}
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      CHANNEL_KEY: ${{ matrix.channel.id }}
      MODE: ${{ inputs.mode || 'auto' }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      YT_REFRESH_TOKEN: ${{ secrets[format('YT_REFRESH_TOKEN_{0}', matrix.channel.suffix)] }}
      YT_CHANNEL_ID: ${{ secrets[format('YT_CHANNEL_ID_{0}', matrix.channel.suffix)] }}

      YT_PRIVACY: ${{ secrets.YT_PRIVACY || 'private' }}
      TTS_PROVIDER: ${{ secrets.TTS_PROVIDER || 'deepgram' }}

      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

      FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      MUSIC_PATH: assets/${{ matrix.channel.id }}/music.mp3

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Pixabay search cache
        uses: actions/cache@v4
        with:
          path: .cache/pixabay
          key: pixabay-${{ matrix.channel.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pixabay-${{ matrix.channel.id }}-

      - name: Install pinned Python libraries
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 30 -r requirements.txt
          python -m pip check

      - name: Set up standalone FFmpeg and FFprobe
        id: ffmpeg_setup
        continue-on-error: true
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Retry transient FFmpeg download
        if: steps.ffmpeg_setup.outcome == 'failure'
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Verify video tools and subtitle font
        timeout-minutes: 1
        run: |
          ffmpeg -version
          ffprobe -version
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Run checks or create video
        if: inputs.mode != 'publish'
        timeout-minutes: 50
        run: python -u agent_bot.py

      - name: Download reviewed preview
        if: inputs.mode == 'publish'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: ${{ matrix.channel.id }}-${{ inputs.source_run_id }}-${{ inputs.source_attempt || '1' }}
          path: output/${{ matrix.channel.id }}

      - name: Upload reviewed video
        if: inputs.mode == 'publish'
        timeout-minutes: 10
        run: python -u agent_bot.py

      - name: Save video and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.channel.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/${{ matrix.channel.id }}/**/*.mp4
            output/${{ matrix.channel.id }}/**/qa_scene*.jpg
            output/${{ matrix.channel.id }}/**/*.json
            output/${{ matrix.channel.id }}/*.srt
          retention-days: 3
          if-no-files-found: ignore


